name: Five Lives
description: >-
  Five Lives is a health-technology company building evidence-based digital
  tools for dementia prevention and brain health for adults aged 50 and over.
  Founded by former Peak brain-training leaders Xavier Louis (CEO) and Sylvain
  Piquet (COO), the fully remote company operates two consumer mobile apps: Five
  Lives Brain Health, a prevention app available since 2021 with cognitive tests,
  brain games, and lifestyle tracking across five pillars (nutrition, sleep,
  physical activity, mood and social connection, and mental stimulation); and
  Five Lives Care, an evidence-based memory and autonomy programme for people
  aged 60+ launched in January 2026 and developed with leading memory centres in
  the UK and France. Its work draws on the FINGER study and the Lancet
  Commission's modifiable dementia risk factors, with research partners including
  the University of Oxford, Trinity College Dublin, the FINGER Brain Health
  Institute, Dementias Platform UK, and the Gerontopole d'Ile de France. Backed
  by Speedinvest. Five Lives does not currently publish a public developer API,
  SDK, or developer portal.
